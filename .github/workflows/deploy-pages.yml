# Builds the Jupyter Book (MyST) site from README.md and the notebooks'
# already-computed, checked-in outputs -- it does not re-run the pipeline or
# re-execute any notebook, so it needs nothing beyond Node and the `jupyter-book`
# npm package, pinned to the same version used for local preview (see
# pyproject.toml's [tool.pixi.dependencies]).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight run finish rather than
# cancel it, so a page is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the site
        run: npx --yes jupyter-book@2.1.6 build --html --strict
        env:
          BASE_URL: /charity_risk

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
